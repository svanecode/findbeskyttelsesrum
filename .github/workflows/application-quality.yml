name: Application quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: application-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  code-quality:
    name: Kode, typer og sikkerhedsregler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hent kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Brug Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Installér låste afhængigheder
        run: npm ci

      - name: Kør obligatoriske pull request-kontroller
        run: |
          npm run lint
          npm run typecheck
          npm test

  database-quality:
    name: Frisk database og integritetsregler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hent kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Brug Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Opret frisk lokal database fra migrationshistorikken
        run: >-
          npx --yes supabase@2.115.0 start
          --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Kør databaseinvarianter
        run: npx --yes supabase@2.115.0 test db supabase/tests/release_1_data_integrity.sql --local

      - name: Stop lokal database
        if: always()
        run: npx --yes supabase@2.115.0 stop --no-backup

  release-story:
    name: Byg og gennemfør browserhistorien
    if: github.event_name != 'pull_request'
    needs:
      - code-quality
      - database-quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Hent kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Brug Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Installér låste afhængigheder
        run: npm ci

      - name: Installér testbrowser
        run: npx playwright install --with-deps chromium

      - name: Byg produktionsversionen
        run: npm run build

      - name: Gennemfør hele browserhistorien
        run: npx playwright test

      - name: Gem browserrapport ved fejl
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
