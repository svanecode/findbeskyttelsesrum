name: Application quality

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly, so a quiet repository still notices a new advisory.
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: application-quality-${{ github.event_name == 'schedule' && 'schedule' || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Its own job that nothing needs: a new advisory or a registry outage must
  # not turn every pull request red, but it must still be noticed.
  dependency-audit:
    name: Sårbarheder i produktionsafhængigheder
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hent kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Brug Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Installér låste afhængigheder
        run: npm ci

      - name: Kontrollér kendte sårbarheder i produktionsafhængigheder
        run: npm audit --omit=dev --audit-level=high

  audit-alert:
    name: Driftsalarm for sårbarheder
    if: always() && github.event_name == 'schedule'
    needs: dependency-audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Hent kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Opret eller opdatér driftsalarm
        if: contains(fromJSON('["failure","cancelled"]'), needs.dependency-audit.result)
        run: |
          bash scripts/monitor/raise-alert.sh dependency-audit-alert "Sårbarhedskontrollen kræver opmærksomhed" \
            "Den ugentlige kontrol af produktionsafhængigheder (npm audit) fejlede. Se kørslen for advisory eller registry-fejl."
      - name: Luk driftsalarm efter succes
        if: needs.dependency-audit.result == 'success'
        run: bash scripts/monitor/close-alert.sh dependency-audit-alert "Den næste ugentlige sårbarhedskontrol gik igennem."

  code-quality:
    name: Kode, typer og sikkerhedsregler
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Hent kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Brug Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Installér låste afhængigheder
        run: npm ci

      - name: Kør obligatoriske pull request-kontroller
        run: |
          npm run lint
          npm run typecheck
          npm test

  database-quality:
    name: Frisk database og integritetsregler
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Hent kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Brug Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Opret frisk lokal database fra migrationshistorikken
        run: >-
          npx --yes supabase@2.115.0 start
          --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: Kør alle databaseinvarianter
        run: npx --yes supabase@2.115.0 test db supabase/tests --local

      - name: Stop lokal database
        if: always()
        run: npx --yes supabase@2.115.0 stop --no-backup

  release-story:
    name: Byg og gennemfør browserhistorien
    if: github.event_name != 'schedule'
    needs:
      - code-quality
      - database-quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      # These values are already embedded in the public browser bundle and
      # authorize only the explicitly granted read models. Never add the
      # service-role/write secret to this pull-request job.
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_HTTP_ORIGIN: "1"
    steps:
      - name: Hent kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Brug Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Installér låste afhængigheder
        run: npm ci

      - name: Kontrollér offentlig read-model-konfiguration
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::Konfigurér repository variable NEXT_PUBLIC_SUPABASE_URL for fork-PR'er."; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::Konfigurér repository variable NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY for fork-PR'er."; exit 1; }

      - name: Installér Chromium, Firefox og WebKit
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Byg produktionsversionen
        run: npm run build

      - name: Gennemfør hele browserhistorien
        run: npx playwright test

      - name: Gem browserrapport ved fejl
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
