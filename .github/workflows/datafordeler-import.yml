name: Datafordeler importer

on:
  schedule:
    - cron: "0 4 * * *"
  pull_request:
    paths:
      - ".github/workflows/datafordeler-import.yml"
      - "tools/datafordeler-importer/**"
      - "supabase/migrations/*datafordeler_import_finalizer.sql"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/datafordeler-import.yml"
      - "tools/datafordeler-importer/**"
      - "supabase/migrations/*datafordeler_import_finalizer.sql"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Hent og kontrollér data uden at skrive til databasen"
        required: true
        type: boolean
        default: true
      max_pages:
        description: "Valgfrit sideloft; tomt felt betyder hele datasættet"
        required: false
        type: string
      resume_latest:
        description: "Fortsæt seneste fejlede skrivekørsel uden manglende-markeringer"
        required: true
        type: boolean
        default: false
      production_confirmation:
        description: "Ved skrivning: skriv SKRIV_PRODUKTION"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: datafordeler-app-v2-main-import
  cancel-in-progress: false

jobs:
  quality:
    name: Kontrollér importerkoden
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/datafordeler-importer
    steps:
      - name: Hent kode
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Brug Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Installér låst miljø
        run: |
          python -m pip install "uv==0.8.22"
          uv sync --frozen --extra dev

      - name: Kør kodekontrol og tests
        run: |
          uv run ruff check .
          uv run mypy shelter_importer
          uv run pytest
          uv run python -m build

  import:
    name: Kør Datafordeler-import
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: tools/datafordeler-importer
    env:
      DATAFORDELER_API_KEY: ${{ secrets.DATAFORDELER_API_KEY }}
      SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      MAX_PAGES: ${{ github.event_name == 'schedule' && '' || inputs.max_pages }}
      RESUME_LATEST: ${{ github.event_name == 'schedule' && 'false' || inputs.resume_latest }}
      PRODUCTION_CONFIRMATION: ${{ github.event_name == 'schedule' && 'SKRIV_PRODUKTION' || inputs.production_confirmation }}
      SUMMARY_PATH: import-summary.json
    steps:
      - name: Hent kode
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Brug Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Installér låst miljø
        run: |
          python -m pip install "uv==0.8.22"
          uv sync --frozen

      - name: Kontrollér godkendelse og hemmeligheder
        shell: bash
        run: |
          if [[ -z "$DATAFORDELER_API_KEY" ]]; then
            echo "GitHub-hemmeligheden DATAFORDELER_API_KEY mangler." >&2
            exit 1
          fi

          if [[ "$DRY_RUN" != "true" ]]; then
            if [[ "$PRODUCTION_CONFIRMATION" != "SKRIV_PRODUKTION" ]]; then
              echo "Produktionsskrivning kræver den præcise bekræftelse SKRIV_PRODUKTION." >&2
              exit 1
            fi
            if [[ -z "$SUPABASE_URL" || -z "$SUPABASE_SECRET_KEY" ]]; then
              echo "NEXT_PUBLIC_SUPABASE_URL eller SUPABASE_SECRET_KEY mangler." >&2
              exit 1
            fi
            if [[ -z "$SUPABASE_PUBLISHABLE_KEY" ]]; then
              echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY mangler til efterkontrollen." >&2
              exit 1
            fi
          fi

      - name: Kontrollér at den gamle importer ikke kører
        if: github.event_name == 'schedule' || inputs.dry_run == false
        shell: bash
        run: |
          for state in in_progress queued; do
            total="$(curl --fail --silent --show-error \
              "https://api.github.com/repos/svanecode/Shelter-updater/actions/workflows/shelter-sync-graphql.yml/runs?status=${state}&per_page=1" \
              | jq -r '.total_count')"
            if [[ "$total" != "0" ]]; then
              echo "Den gamle importer har en ${state}-kørsel. Prøv igen, når den er færdig." >&2
              exit 1
            fi
          done

      - name: Kør import
        shell: bash
        run: |
          args=(--write)
          if [[ "$DRY_RUN" == "true" ]]; then
            args=(--dry-run)
          fi
          if [[ -n "$MAX_PAGES" ]]; then
            args+=(--max-pages "$MAX_PAGES")
          fi
          if [[ "$RESUME_LATEST" == "true" ]]; then
            args+=(--resume-latest)
          fi
          uv run python sync_shelters_graphql.py "${args[@]}"

      - name: Brug Node.js 24 til efterkontrol
        if: github.event_name == 'schedule' || inputs.dry_run == false
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Installér webprojektets låste afhængigheder
        if: github.event_name == 'schedule' || inputs.dry_run == false
        working-directory: .
        run: npm ci

      - name: Kontrollér database og website efter skrivning
        if: github.event_name == 'schedule' || inputs.dry_run == false
        working-directory: .
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          npm run parity:exclusions
          npm run parity:municipalities
          npm run read:app-v2-sanity
          npm run monitor:production

      - name: Vis hemmelighedsfri opsummering
        if: always()
        shell: bash
        run: |
          if [[ -f "$SUMMARY_PATH" ]]; then
            {
              echo "## Datafordeler-import"
              echo '```json'
              jq . "$SUMMARY_PATH"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Datafordeler-import" >> "$GITHUB_STEP_SUMMARY"
            echo "Der blev ikke oprettet en opsummering." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Gem hemmelighedsfri opsummering
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: datafordeler-import-summary-${{ github.run_id }}
          path: tools/datafordeler-importer/import-summary.json
          if-no-files-found: warn
          retention-days: 30
