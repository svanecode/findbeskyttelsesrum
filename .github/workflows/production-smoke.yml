name: Production smoke monitoring

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    name: Kontroller produktion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hent kode
        uses: actions/checkout@v4
      - name: Brug Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Kør syntetiske kontroller
        run: node scripts/monitor/production-smoke.mjs
