name: Production smoke monitoring

on:
  schedule:
    # GitHub delays scheduled runs by hours under load; health treats a late
    # heartbeat as a warning and only degrades after 24 hours.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    name: Kontroller produktion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Hent kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Brug Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Kør syntetiske kontroller
        env:
          SMOKE_EXPECTED_GIT_SHA: ${{ github.sha }}
          SMOKE_ALLOW_STALE_OPERATIONAL_HEARTBEAT: "true"
        run: node scripts/monitor/production-smoke.mjs
      - name: Registrér betroet driftsheartbeat
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPERATION_HEARTBEAT_SOURCE: github-production-smoke
          OPERATION_HEARTBEAT_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          OPERATION_HEARTBEAT_GIT_SHA: ${{ github.sha }}
        run: node scripts/monitor/record-trusted-heartbeat.mjs
      - name: Kontrollér anonyme driftstal
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/monitor/product-metrics-health.mjs

      - name: Opret gratis driftsalarm ved fejl
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OWNER: ${{ github.repository_owner }}
        shell: bash
        # The alert must reach a person, not only sit as an open issue: a new
        # alert is assigned to the repository owner (GitHub notifies the
        # assignee by e-mail and in the GitHub app), and an alert that is still
        # failing after a day gets one reminder comment a day. Runs in between
        # only update the issue text, which sends no notification.
        run: |
          gh label create production-alert --color B60205 --description "Automatisk alarm for produktionskontrol" --force
          alert="$(gh issue list --label production-alert --state open --limit 1 --json number,url --jq '.[0].number' 2>/dev/null || true)"
          now="$(date -u +%Y-%m-%dT%H:%MZ)"
          if [[ -z "$alert" ]]; then
            gh issue create \
              --title "Produktionskontrollen kræver opmærksomhed" \
              --label production-alert \
              --assignee "$OWNER" \
              --body "@$OWNER Den automatiske kontrol af website, data eller anonyme driftstal fejlede $now. Se kørslen: $RUN_URL"
          else
            gh issue edit "$alert" --add-assignee "$OWNER" >/dev/null || true
            last="$(gh api "repos/${{ github.repository }}/issues/$alert/comments" --jq 'map(select(.body | startswith("Påmindelse"))) | last | .created_at // ""' 2>/dev/null || true)"
            if [[ -z "$last" ]] || (( $(date -u +%s) - $(date -u -d "$last" +%s) > 86400 )); then
              gh issue comment "$alert" --body "Påmindelse til @$OWNER: produktionskontrollen fejler stadig ($now). Se kørslen: $RUN_URL"
            else
              gh issue edit "$alert" --body "@$OWNER Produktionskontrollen fejler. Seneste fejl $now. Se kørslen: $RUN_URL"
            fi
          fi

      - name: Luk driftsalarm efter næste succes
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          alert_url="$(gh issue list --label production-alert --state open --limit 1 --json url --jq '.[0].url' 2>/dev/null || true)"
          if [[ -n "$alert_url" ]]; then
            gh issue close "$alert_url" --comment "Den næste produktionskontrol bestod. Se kørslen: $RUN_URL"
          fi
