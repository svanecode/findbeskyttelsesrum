name: Production smoke monitoring

on:
  schedule:
    # GitHub delays scheduled runs by hours under load; health treats a late
    # heartbeat as a warning and only degrades after 24 hours.
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: production-smoke
  cancel-in-progress: true

# Each job asks for what it needs; nothing is granted to the workflow as a whole.
permissions: {}

jobs:
  smoke:
    name: Kontroller produktion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Hent kode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Brug Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Kør syntetiske kontroller
        env:
          SMOKE_EXPECTED_GIT_SHA: ${{ github.sha }}
          SMOKE_ALLOW_STALE_OPERATIONAL_HEARTBEAT: "true"
        run: node scripts/monitor/production-smoke.mjs
      - name: Registrér betroet driftsheartbeat
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPERATION_HEARTBEAT_SOURCE: github-production-smoke
          OPERATION_HEARTBEAT_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
          OPERATION_HEARTBEAT_GIT_SHA: ${{ github.sha }}
        run: node scripts/monitor/record-trusted-heartbeat.mjs
      - name: Kontrollér anonyme driftstal
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: node scripts/monitor/product-metrics-health.mjs

      - name: Opret gratis driftsalarm ved fejl
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/monitor/raise-alert.sh production-alert "Produktionskontrollen kræver opmærksomhed" "Den automatiske kontrol af website, data eller anonyme driftstal fejlede."

      - name: Luk driftsalarm efter næste succes
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash scripts/monitor/close-alert.sh production-alert "Den næste produktionskontrol bestod."

  # GitHub disables scheduled workflows in a public repository after 60 days
  # without repository activity. Calling the "enable" API once a day resets
  # that inactivity limit for both scheduled workflows. Its own job, so only
  # this one call can write to GitHub Actions.
  keep-alive:
    name: Hold planlagte workflows aktive
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Hold planlagte workflows aktive
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$(date -u +%H)" == "03" ]]; then
            gh api -X PUT "repos/$REPO/actions/workflows/datafordeler-import.yml/enable"
            gh api -X PUT "repos/$REPO/actions/workflows/production-smoke.yml/enable"
          fi
