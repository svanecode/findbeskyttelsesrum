version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    # Majors (Tailwind 4, ESLint 10, TypeScript 7 …) get their own PRs; see
    # DEPS-01 in docs/improvement-plan.md before merging one.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /tools/datafordeler-importer
    schedule:
      interval: monthly
    groups:
      importer:
        patterns:
          - "*"
