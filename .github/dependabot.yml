version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Room for the three grouped PRs next to the deferred majors. With a limit
    # of 5, four open major PRs and the test-tooling PR used every slot, and the
    # production group (where a `next` patch arrives) could not open.
    open-pull-requests-limit: 10
    groups:
      # Groups are matched in order and a package joins the first one it
      # matches, so test tooling must come first: a flaky Playwright or axe
      # release then only blocks its own PR, not a `next` patch.
      test-tooling:
        patterns:
          - "@playwright/test"
          - "@axe-core/playwright"
        update-types:
          - minor
          - patch
      production-minor-and-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-minor-and-patch:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Majors (Tailwind 4, ESLint 10, TypeScript 7 …) get their own PRs; see
    # DEPS-01 in docs/improvement-plan.md before merging one.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /tools/datafordeler-importer
    schedule:
      interval: monthly
    groups:
      importer:
        patterns:
          - "*"
