[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "findbeskyttelsesrum-importer"
version = "2.1.0"
description = "Idempotent Datafordeler BBR/DAR v3 importer for app_v2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
  "pyproj>=3.6,<4",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "ruff>=0.5,<1",
  "types-requests>=2.31,<3",
]

[project.scripts]
shelter-importer = "shelter_importer.cli:main"

[tool.setuptools.packages.find]
include = ["shelter_importer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
packages = ["shelter_importer"]
strict = true
